{# templates/auth/signup.html #}
{% extends "base.html" %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 4rem auto;">
    <div class="card">
        <h1 style="margin-top: 0; font-size: 1.5rem;">Create account</h1>
        <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem;">Start prioritizing your vulnerabilities today</p>
        
        <form action="/signup" method="post">
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" name="email" id="email" class="form-control" required placeholder="name@company.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" class="form-control" required placeholder="••••••••">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" name="confirm_password" id="confirm_password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 0.5rem;">
                Create account
            </button>
        </form>
        
        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; border-top: 1px solid var(--border); padding-top: 1rem;">
            Already have an account? <a href="/login" style="color: var(--primary); font-weight: 600; text-decoration: none;">Log in</a>
        </div>
    </div>
</div>
{% endblock %}
