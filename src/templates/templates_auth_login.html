{# templates/auth/login.html #}
{% extends "base.html" %}

{% block title %}Log In{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 4rem auto;">
    <div class="card">
        <h1 style="margin-top: 0; font-size: 1.5rem;">Welcome back</h1>
        <p style="color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem;">Enter your credentials to access VulnRadar</p>
        
        <form action="/login" method="post">
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" name="email" id="email" class="form-control" required placeholder="name@company.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 0.5rem;">
                Log in
            </button>
        </form>
        
        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; border-top: 1px solid var(--border); padding-top: 1rem;">
            Don't have an account? <a href="/signup" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign up</a>
        </div>
    </div>
</div>
{% endblock %}
